<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Méta-tags pour désactiver la mise en cache navigateur -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SGE - Système de Résonance Géométrique</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #ffd700;
      --accent-blue: #38bdf8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .header-info {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .header-info p#date-course {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-info h2#hippodrome-course {
      font-size: 1.4rem;
      color: var(--text-main);
      margin-top: 4px;
    }

    .header-info h3#nom-course {
      font-size: 1.1rem;
      color: var(--accent-gold);
      margin-top: 6px;
      font-style: italic;
      font-weight: 600;
    }

    .header-info p#discipline-course {
      font-size: 0.95rem;
      color: var(--accent-blue);
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.green {
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .dot.red {
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .prono-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .number-ball {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      font-weight: bold;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.4);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .number-ball.red-ball {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
    }

    .number-ball:hover {
      transform: scale(1.1);
    }

    .officiel-section {
      margin-top: 15px;
      margin-bottom: 25px;
    }

    .details-box {
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: left;
      line-height: 1.6;
    }

    .details-box span {
      color: var(--text-main);
      font-weight: 600;
    }

    .loader {
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--accent-blue);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-info">
      <p id="date-course">Chargement...</p>
      <h2 id="hippodrome-course">--</h2>
      <h3 id="nom-course">--</h3>
      <p id="discipline-course">--</p>
    </div>

    <div class="status-badge" id="status-badge">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Analyse en cours...</span>
    </div>

    <div class="section-title">PRONOSTIC DE RÉSONANCE SGE</div>
    <div id="loader" class="loader"></div>
    <div class="prono-container" id="prono-container" style="display: none;"></div>

    <div class="officiel-section" id="officiel-section" style="display: none;">
      <div class="section-title" style="color: #ef4444; margin-top: 15px;">ARRIVÉE OFFICIELLE</div>
      <div class="prono-container" id="officiel-container" style="margin-bottom: 0;"></div>
    </div>

    <div class="details-box" id="details-box" style="display: none;">
      <div>Favori Référent : <span id="favori-val">--</span></div>
      <div>Non-Partants : <span id="np-val">Aucun</span></div>
      <div>Apprentissage Veille : <span id="veille-val">--</span></div>
    </div>
  </div>

  <script>
    // URL Backend Render
    const BASE_URL = "https://pegasus-backend-c3a6.onrender.com/predict";

    async function chargerPronostic() {
      try {
        // Ajout d'un horodatage unique (t=timestamp) pour casser le cache navigateur & Vercel
        const urlAntiCache = `${BASE_URL}?t=${new Date().getTime()}`;
        
        const response = await fetch(urlAntiCache, {
          cache: 'no-store',
          headers: {
            'Pragma': 'no-cache',
            'Cache-Control': 'no-cache'
          }
        });
        
        const data = await response.json();

        // 1. Infos course
        document.getElementById('date-course').innerText = data.date || "AUJOURD'HUI";
        document.getElementById('hippodrome-course').innerText = data.hippodrome || "Hippodrome";
        document.getElementById('nom-course').innerText = data.nom_course || "";
        document.getElementById('discipline-course').innerText = data.discipline_distance || "";

        // 2. Diode d'état
        const dot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        if (data.course_terminee) {
          dot.className = "dot red";
          statusText.innerText = "Course Terminée";
        } else {
          dot.className = "dot green";
          statusText.innerText = "Analyse Live Active";
        }

        // 3. Affichage Pronostic SGE (Boules Jaunes)
        const pronoContainer = document.getElementById('prono-container');
        pronoContainer.innerHTML = ''; 

        if (data.quinte_sge && data.quinte_sge.length >= 5) {
          data.quinte_sge.forEach(num => {
            const ball = document.createElement('div');
            ball.className = 'number-ball';
            ball.innerText = num;
            const coteVal = (data.cotes && data.cotes[num]) ? data.cotes[num] : 'NC';
            ball.title = `Cote PMU : ${coteVal}`;
            pronoContainer.appendChild(ball);
          });
        }

        // 4. Affichage Arrivée Officielle (Boules Rouges)
        const officielSection = document.getElementById('officiel-section');
        const officielContainer = document.getElementById('officiel-container');
        officielContainer.innerHTML = '';

        if (data.arrivee_officielle && data.arrivee_officielle.length >= 5) {
          data.arrivee_officielle.forEach(num => {
            const ball = document.createElement('div');
            ball.className = 'number-ball red-ball';
            ball.innerText = num;
            officielContainer.appendChild(ball);
          });
          officielSection.style.display = 'block';
        } else {
          officielSection.style.display = 'none';
        }

        // 5. Infos complémentaires
        document.getElementById('favori-val').innerText = data.favori ? `N° ${data.favori}` : "Non disponible";
        document.getElementById('np-val').innerText = (data.non_partants && data.non_partants.length > 0) 
          ? data.non_partants.map(n => `N°${n}`).join(', ') 
          : "Aucun";
        document.getElementById('veille-val').innerText = (data.arrivee_veille_injectee && data.arrivee_veille_injectee.length > 0)
          ? data.arrivee_veille_injectee.join(' - ')
          : "Non disponible";

        // Affichage final
        document.getElementById('loader').style.display = 'none';
        pronoContainer.style.display = 'flex';
        document.getElementById('details-box').style.display = 'block';

      } catch (error) {
        console.error("Erreur de synchronisation :", error);
        document.getElementById('loader').style.display = 'none';
        document.getElementById('status-text').innerText = "Connexion serveur...";
      }
    }

    window.addEventListener('DOMContentLoaded', chargerPronostic);
  </script>
</body>
</html>
