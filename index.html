<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGE - Système de Résonance Géométrique</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-gold: #ffd700;
      --accent-blue: #38bdf8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .header-info {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .header-info p#date-course {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-info h2#hippodrome-course {
      font-size: 1.4rem;
      color: var(--text-main);
      margin-top: 4px;
    }

    .header-info h3#nom-course {
      font-size: 1.1rem;
      color: var(--accent-gold);
      margin-top: 6px;
      font-style: italic;
      font-weight: 600;
    }

    .header-info p#discipline-course {
      font-size: 0.95rem;
      color: var(--accent-blue);
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.green {
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .dot.red {
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .prono-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .number-ball {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      font-weight: bold;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.4);
    }

    .details-box {
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: left;
      line-height: 1.6;
    }

    .details-box span {
      color: var(--text-main);
      font-weight: 600;
    }

    .loader {
      border: 3px solid var(--border-color);
      border-top: 3px solid var(--accent-blue);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- En-tête de la course -->
    <div class="header-info">
      <p id="date-course">Chargement...</p>
      <h2 id="hippodrome-course">--</h2>
      <h3 id="nom-course">--</h3>
      <p id="discipline-course">--</p>
    </div>

    <!-- Statut de la course (Diode) -->
    <div class="status-badge" id="status-badge">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Analyse en cours...</span>
    </div>

    <!-- Titre Pronostic -->
    <div class="section-title">Pronostic de Résonance SGE</div>

    <!-- Loader -->
    <div id="loader" class="loader"></div>

    <!-- Balles des numéros -->
    <div class="prono-container" id="prono-container" style="display: none;">
      <div class="number-ball">-</div>
      <div class="number-ball">-</div>
      <div class="number-ball">-</div>
      <div class="number-ball">-</div>
      <div class="number-ball">-</div>
    </div>

    <!-- Informations complémentaires -->
    <div class="details-box" id="details-box" style="display: none;">
      <div>Favori Référent : <span id="favori-val">--</span></div>
      <div>Non-Partants : <span id="np-val">Aucun</span></div>
      <div>Apprentissage Veille : <span id="veille-val">--</span></div>
    </div>
  </div>

  <script>
    // URL directe intégrée vers votre serveur Render
    const API_URL = "https://pegasus-backend-c3a6.onrender.com/predict";

    async function chargerPronostic() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        // 1. Mise à jour des informations de la course
        document.getElementById('date-course').innerText = data.date || "AUJOURD'HUI";
        document.getElementById('hippodrome-course').innerText = data.hippodrome || "Hippodrome";
        document.getElementById('nom-course').innerText = data.nom_course || "";
        document.getElementById('discipline-course').innerText = data.discipline_distance || "";

        // 2. Gestion de la diode d'état
        const dot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        if (data.course_terminee) {
          dot.className = "dot red";
          statusText.innerText = "Course Terminée";
        } else {
          dot.className = "dot green";
          statusText.innerText = "Analyse Live Active";
        }

        // 3. Affichage du pronostic SGE (5 numéros)
        const pronoContainer = document.getElementById('prono-container');
        pronoContainer.innerHTML = ''; // Réinitialisation

        if (data.quinte_sge && data.quinte_sge.length >= 5) {
          data.quinte_sge.forEach(num => {
            const ball = document.createElement('div');
            ball.className = 'number-ball';
            ball.innerText = num;
            pronoContainer.appendChild(ball);
          });
        }

        // 4. Détails techniques
        document.getElementById('favori-val').innerText = data.favori ? `N° ${data.favori}` : "Non disponible";
        document.getElementById('np-val').innerText = (data.non_partants && data.non_partants.length > 0) 
          ? data.non_partants.map(n => `N°${n}`).join(', ') 
          : "Aucun";
        document.getElementById('veille-val').innerText = (data.arrivee_veille_injectee && data.arrivee_veille_injectee.length > 0)
          ? data.arrivee_veille_injectee.join(' - ')
          : "Non disponible";

        // Masquer le loader et afficher le contenu
        document.getElementById('loader').style.display = 'none';
        pronoContainer.style.display = 'flex';
        document.getElementById('details-box').style.display = 'block';

      } catch (error) {
        console.error("Erreur lors de la récupération du pronostic :", error);
        document.getElementById('loader').style.display = 'none';
        document.getElementById('status-text').innerText = "Erreur de connexion au serveur";
      }
    }

    // Lancement au chargement de la page
    window.addEventListener('DOMContentLoaded', chargerPronostic);
  </script>
</body>
</html>
