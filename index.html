<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Système de Géométrie Électronique (SGE)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --status-green: #10b981;
      --status-red: #ef4444;
      --orange-ball: #f97316;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .nom-course {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .info-course-ligne {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .badge-reunion {
      background-color: #334155;
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .status-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-green {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--status-green);
      color: var(--status-green);
    }

    .status-red {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--status-red);
      color: var(--status-red);
    }

    .btn-actualiser {
      width: 100%;
      padding: 12px;
      margin: 20px 0;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-actualiser:hover {
      background-color: #059669;
    }

    .prono-section {
      text-align: center;
      margin-top: 15px;
    }

    .prono-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-bottom: 15px;
    }

    .chevaux-grid {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .cheval-ball {
      width: 45px;
      height: 45px;
      background-color: var(--accent-color);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
    }

    .cheval-ball-orange {
      background-color: var(--orange-ball);
      box-shadow: 0 4px 10px rgba(249, 115, 22, 0.4);
    }

    .info-details {
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div id="nom-course" class="nom-course">Chargement...</div>
    <div class="info-course-ligne">
      <span id="badge-hippo" class="badge-reunion">--</span>
      <span id="disc-course">--</span>
    </div>
    <div id="date-course" class="info-course-ligne" style="font-size: 0.85rem;">(--/--/----)</div>
    <div id="status-badge" class="status-badge status-green">COURSE NON DÉBUTÉE</div>
  </div>

  <button id="btn-action" class="btn-actualiser" onclick="chargerPronostic()">Actualiser le Pronostic</button>

  <div id="zone-affichage"></div>
</div>

<script>
  function chargerPronostic() {
    const zoneAffichage = document.getElementById('zone-affichage');
    const badgeStatus = document.getElementById('status-badge');
    const btnAction = document.getElementById('btn-action');
    
    document.getElementById('nom-course').textContent = "Chargement...";

    // Anti-cache HTTP avec horodatage
    const urlApi = window.location.origin + '/predict?t=' + new Date().getTime();

    fetch(urlApi, { cache: 'no-store' })
      .then(res => res.json())
      .then(data => {
        document.getElementById('nom-course').textContent = data.nom_course;
        document.getElementById('badge-hippo').textContent = data.hippodrome;
        document.getElementById('disc-course').textContent = ` | ${data.discipline_distance}`;
        document.getElementById('date-course').textContent = `Date : ${data.date}`;

        // Détection de l'état de la course (si l'arrivée est là ou si course_terminee est vrai)
        const aUneArrivee = data.arrivee_officielle && data.arrivee_officielle.length >= 5;
        const estTerminee = data.course_terminee || aUneArrivee;

        if (estTerminee) {
          badgeStatus.textContent = "COURSE TERMINÉE";
          badgeStatus.className = "status-badge status-red";
          btnAction.textContent = "Actualiser l'Arrivée";
        } else {
          badgeStatus.textContent = "COURSE NON DÉBUTÉE";
          badgeStatus.className = "status-badge status-green";
          btnAction.textContent = "Actualiser le Pronostic";
        }

        let htmlProno = data.quinte_sge.map(num => `<div class="cheval-ball">${num}</div>`).join('');
        let nonPartantsText = data.non_partants && data.non_partants.length > 0 ? data.non_partants.join(', ') : 'Aucun';

        let htmlArrivee = '';
        if (aUneArrivee) {
          let ballsArrivee = data.arrivee_officielle.map(num => `<div class="cheval-ball cheval-ball-orange">${num}</div>`).join('');
          htmlArrivee = `
            <div class="prono-section" style="margin-top: 25px;">
              <div class="prono-title" style="color: var(--orange-ball);">ARRIVÉE OFFICIELLE DU QUINTÉ</div>
              <div class="chevaux-grid">${ballsArrivee}</div>
            </div>
          `;
        }

        zoneAffichage.innerHTML = `
          <div class="prono-section">
            <div class="prono-title">PRONOSTIC DE RÉSONANCE SGE</div>
            <div class="chevaux-grid">${htmlProno}</div>
          </div>
          ${htmlArrivee}
          <div class="info-details">
            <strong>Favori de la Presse :</strong> N° ${data.favori}<br/>
            <strong>Non-partant(s) :</strong> ${nonPartantsText}
          </div>
        `;
      })
      .catch(err => {
        console.error(err);
        document.getElementById('nom-course').textContent = "Erreur de chargement";
      });
  }

  window.onload = chargerPronostic;
</script>

</body>
</html>
