<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Système de Géométrie Électronique (SGE)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --warning-bg: rgba(245, 158, 11, 0.1);
      --warning-border: #f59e0b;
      --warning-text: #fbbf24;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .nom-course {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 5px;
    }

    .info-course {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-actualiser {
      width: 100%;
      padding: 12px;
      margin: 20px 0;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-actualiser:hover {
      background-color: #059669;
    }

    .prono-section {
      text-align: center;
      margin-top: 15px;
    }

    .prono-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      margin-bottom: 15px;
    }

    .chevaux-grid {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .cheval-ball {
      width: 45px;
      height: 45px;
      background-color: var(--accent-color);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
    }

    .info-details {
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .warning-box {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
      padding: 18px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
      font-size: 0.95rem;
      margin: 15px 0;
    }

    .warning-box strong {
      font-size: 1.05rem;
      display: inline-block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div id="nom-course" class="nom-course">Chargement...</div>
    <div id="info-course" class="info-course">Veuillez patienter...</div>
    <div id="status-badge" class="status-badge">SESSION SGE</div>
  </div>

  <button class="btn-actualiser" onclick="chargerPronostic()">Actualiser le Pronostic</button>

  <div id="zone-affichage">
    <!-- Le contenu sera injecté dynamiquement par JavaScript -->
  </div>
</div>

<script>
  function chargerPronostic() {
    fetch('/predict')
      .then(res => res.json())
      .then(data => {
        // Mise à jour de l'en-tête de la course
        document.getElementById('nom-course').textContent = data.nom_course || "SGE - Course du Jour";
        document.getElementById('info-course').textContent = `${data.hippodrome || ''} ${data.discipline_distance ? '- ' + data.discipline_distance : ''} (${data.date || ''})`;

        const zoneAffichage = document.getElementById('zone-affichage');

        // Cas : Message d'avertissement si la course ne comporte pas 16 partants
        if (data.status === "error" || data.message_visiteur) {
          zoneAffichage.innerHTML = `
            <div class="warning-box">
              <strong> Information SGE :</strong><br/>
              ${data.message_visiteur.replace(/\n/g, '<br/>')}
            </div>
          `;
          return;
        }

        // Cas : Course de 16 partants (Affichage normal du Pronostic)
        let htmlChevaux = data.quinte_sge.map(num => `<div class="cheval-ball">${num}</div>`).join('');
        let nonPartantsText = data.non_partants && data.non_partants.length > 0 ? data.non_partants.join(', ') : 'Aucun';

        zoneAffichage.innerHTML = `
          <div class="prono-section">
            <div class="prono-title">PRONOSTIC DE RÉSONANCE SGE</div>
            <div class="chevaux-grid">${htmlChevaux}</div>
          </div>
          <div class="info-details">
            <strong>Favori Référent :</strong> N° ${data.favori || 'Non défini'}<br/>
            <strong>Non-partants :</strong> ${nonPartantsText}
          </div>
        `;
      })
      .catch(err => {
        console.error("Erreur chargement:", err);
        document.getElementById('zone-affichage').innerHTML = `
          <div class="warning-box">
            <strong> Erreur de connexion :</strong><br/>
            Impossible de contacter le serveur SGE. Veuillez réessayer.
          </div>
        `;
      });
  }

  // Lancement automatique au chargement de la page
  window.onload = chargerPronostic;
</script>

</body>
</html>
