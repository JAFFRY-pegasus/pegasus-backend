<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyseur Géométrique Quinté</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        h1 { color: #f39c12; }
        .grid-container { display: grid; grid-template-columns: repeat(8, 50px); gap: 10px; justify-content: center; margin: 20px auto; }
        .cell { width: 50px; height: 50px; background: #222; border: 2px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; user-select: none; }
        .cell.selected { background: #e67e22; border-color: #f39c12; color: #fff; }
        .cell.central-pillar { border-color: #3498db; }
        .controls { margin: 20px 0; }
        button { background: #27ae60; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2ec771; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; }
        .status-valide { color: #2ecc71; }
        .status-invalide { color: #e74c3c; }
    </style>
</head>
<body>

    <h1>Analyseur Géométrique Quinté (1–16)</h1>
    <p>Sélectionne 5 numéros pour analyser l'ancrage et la géométrie via l'API Vercel.</p>

    <div class="grid-container" id="grid"></div>

    <div class="controls">
        <button onclick="reinitialiser()">Réinitialiser</button>
    </div>

    <div id="result">Sélectionne 5 numéros</div>

<script>
    const API_URL = "https://pegasus-backend-zku1.vercel.app/evaluate";
    let selection = [];

    const gridEl = document.getElementById('grid');
    for (let i = 1; i <= 16; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        if ([3, 5, 11, 13].includes(i)) cell.classList.add('central-pillar');
        cell.innerText = i;
        cell.onclick = () => basculerNumero(i, cell);
        gridEl.appendChild(cell);
    }

    function basculerNumero(num, cell) {
        if (selection.includes(num)) {
            selection = selection.filter(n => n !== num);
            cell.classList.remove('selected');
        } else {
            if (selection.length < 5) {
                selection.push(num);
                cell.classList.add('selected');
            }
        }
        analyserGrille();
    }

    function reinitialiser() {
        selection = [];
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('selected'));
        document.getElementById('result').innerHTML = "Sélectionne 5 numéros";
    }

    async function analyserGrille() {
        const resultEl = document.getElementById('result');
        if (selection.length !== 5) {
            resultEl.innerHTML = `Sélection : ${selection.length}/5 numéros`;
            return;
        }

        resultEl.innerHTML = "Calcul en cours via Vercel...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ numbers: selection })
            });

            const data = await response.json();

            if (!data.is_valid) {
                resultEl.innerHTML = `<span class="status-invalide">ÉLIMINÉE : Absence d'ancrage central (3, 5, 11, 13) ou déséquilibre 1-8 / 9-16</span>`;
            } else {
                resultEl.innerHTML = `<span class="status-valide">GRILLE VALIDE</span><br>Score Géométrique : <strong>${data.score}</strong>`;
            }
        } catch (err) {
            resultEl.innerHTML = `<span class="status-invalide">Erreur de connexion avec l'API Vercel</span>`;
        }
    }
</script>
</body>
</html>
