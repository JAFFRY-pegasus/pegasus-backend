<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronostic Résonance SGE - Quinté+</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-yellow: #f1e05a;
            --accent-red: #ff4d4d;
            --accent-blue: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }

        .header h1 {
            color: var(--accent-blue);
            margin: 0 0 8px 0;
            font-size: 1.5rem;
        }

        .header p {
            color: var(--text-muted);
            margin: 0 0 20px 0;
            font-size: 0.9rem;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status-badge.attente {
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .status-badge.terminee {
            background-color: rgba(255, 77, 77, 0.15);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .section-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balls-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .ball-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ball {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #000;
        }

        /* Boules jaunes (SGE) */
        .ball-yellow {
            background: radial-gradient(circle at 30% 30%, #fff677, var(--accent-yellow), #bfa800);
            box-shadow: 0 0 12px rgba(241, 224, 90, 0.6);
            animation: pulse-yellow 2s infinite alternate;
        }

        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 8px rgba(241, 224, 90, 0.4); transform: scale(1); }
            100% { box-shadow: 0 0 18px rgba(241, 224, 90, 0.8); transform: scale(1.04); }
        }

        /* Boules rouges (Arrivée Officielle) */
        .ball-red {
            background: radial-gradient(circle at 30% 30%, #ff9999, var(--accent-red), #b30000);
            box-shadow: 0 0 12px rgba(255, 77, 77, 0.6);
            color: #fff;
            animation: pulse-red 2s infinite alternate;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 8px rgba(255, 77, 77, 0.4); transform: scale(1); }
            100% { box-shadow: 0 0 18px rgba(255, 77, 77, 0.8); transform: scale(1.04); }
        }

        .cote {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .arrivee-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        .btn-refresh {
            background-color: #238636;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .btn-refresh:hover {
            background-color: #2ea043;
        }

        .footer-info {
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
            background-color: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1 id="nom-course">Chargement...</h1>
        <p id="info-course">--/--/---- - Hippodrome (PLAT)</p>
    </div>

    <div id="status-badge" class="status-badge attente">En attente du départ</div>

    <!-- Pronostic SGE (Boules Jaunes) -->
    <div class="section-title">Pronostic de Résonance SGE</div>
    <div id="prono-container" class="balls-container">
        <!-- Généré dynamiquement -->
    </div>

    <!-- Arrivée Officielle (Boules Rouges, masquée si pas encore disponible) -->
    <div id="arrivee-section" class="arrivee-section" style="display: none;">
        <div class="section-title" style="color: var(--accent-red);">Arrivée Officielle</div>
        <div id="arrivee-container" class="balls-container">
            <!-- Généré dynamiquement -->
        </div>
    </div>

    <button class="btn-refresh" onclick="chargerDonnees()">Actualiser le Pronostic</button>

    <div class="footer-info">
        <div><strong>Favori Référent :</strong> <span id="favori-val">--</span></div>
        <div><strong>Non-partants :</strong> <span id="np-val">Aucun</span></div>
    </div>
</div>

<script>
async function chargerDonnees() {
    try {
        const response = await fetch('/predict');
        const data = await response.json();

        // Mettre à jour l'en-tête
        document.getElementById('nom-course').innerText = data.nom_course;
        document.getElementById('info-course').innerText = `${data.date} - ${data.hippodrome} (${data.discipline_distance})`;

        // Badge de statut
        const badge = document.getElementById('status-badge');
        if (data.course_terminee) {
            badge.innerText = "Course terminée";
            badge.className = "status-badge terminee";
        } else {
            badge.innerText = "Course en cours / À venir";
            badge.className = "status-badge attente";
        }

        // Affichage du Pronostic SGE (Boules Jaunes)
        const pronoContainer = document.getElementById('prono-container');
        pronoContainer.innerHTML = '';
        if (data.quinte_sge && data.quinte_sge.length > 0) {
            data.quinte_sge.forEach(num => {
                const cote = data.cotes && data.cotes[num] ? `${data.cotes[num]}` : '-';
                pronoContainer.innerHTML += `
                    <div class="ball-wrapper">
                        <div class="ball ball-yellow">${num}</div>
                        <div class="cote">${cote}</div>
                    </div>
                `;
            });
        }

        // Affichage de l'Arrivée Officielle (Boules Rouges)
        const arriveeSection = document.getElementById('arrivee-section');
        const arriveeContainer = document.getElementById('arrivee-container');
        arriveeContainer.innerHTML = '';

        if (data.arrivee_officielle && data.arrivee_officielle.length >= 5) {
            arriveeSection.style.display = 'block';
            data.arrivee_officielle.slice(0, 5).forEach(num => {
                arriveeContainer.innerHTML += `
                    <div class="ball-wrapper">
                        <div class="ball ball-red">${num}</div>
                    </div>
                `;
            });
        } else {
            arriveeSection.style.display = 'none';
        }

        // Pied de page
        document.getElementById('favori-val').innerText = data.favori ? `N°${data.favori}` : 'Non défini';
        document.getElementById('np-val').innerText = (data.non_partants && data.non_partants.length > 0) 
            ? data.non_partants.join(', ') 
            : 'Aucun';

    } catch (err) {
        console.error("Erreur de chargement :", err);
    }
}

// Chargement automatique au démarrage
chargerDonnees();
</script>

</body>
</html>
