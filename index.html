<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEGASUS IA - Pronostics Quinté SGE</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-color: #10b981;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: var(--text-color);
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .version-badge {
            background-color: var(--accent-color);
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: normal;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .data-card {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-secondary);
        }

        .value {
            font-weight: bold;
        }

        .result-box {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .result-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #a7f3d0;
        }

        .result-selection {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .btn-update {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-update:hover {
            background-color: #2563eb;
        }

        .status-msg {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PEGASUS IA <span class="version-badge">SGE v6.0</span></h1>
    <div class="subtitle">Analyse géométrique & résonances matinales</div>

    <div class="data-card">
        <div class="data-row">
            <span class="label">Favori retenu :</span>
            <span class="value" id="sge-favori">-</span>
        </div>
        <div class="data-row">
            <span class="label">Non-partants détectés :</span>
            <span class="value" id="sge-np">Aucun</span>
        </div>
    </div>

    <div class="result-box">
        <div class="result-title">Sélection Quinté Recommandée</div>
        <div class="result-selection" id="sge-quinte">-- -- -- -- --</div>
    </div>

    <button class="btn-update" onclick="chargerPronosticSGE()">Actualiser les résonances</button>
    <div class="status-msg" id="status-text">Initialisation des systèmes...</div>
</div>

<script>
    const API_URL = 'https://pegasus-backend-c3a6.onrender.com/predict';

    async function chargerPronosticSGE() {
        const quinteEl = document.getElementById('sge-quinte');
        const favoriEl = document.getElementById('sge-favori');
        const npEl = document.getElementById('sge-np');
        const statusEl = document.getElementById('status-text');

        quinteEl.innerText = "-- -- -- -- --";
        statusEl.innerText = "Analyse en cours... (Serveur en démarrage : 10 à 30 sec)";

        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Erreur réseau HTTP " + response.status);

            const data = await response.json();

            favoriEl.innerText = data.favori ? "Cheval " + data.favori : "Non défini";
            npEl.innerText = (data.non_partants && data.non_partants.length > 0) 
                             ? data.non_partants.join(', ') 
                             : 'Aucun';
            
            if (data.quinte_sge && data.quinte_sge.length > 0) {
                quinteEl.innerText = data.quinte_sge.join(' - ');
            } else {
                quinteEl.innerText = "Données indisponibles";
            }

            statusEl.innerText = "Dernière mise à jour effectuée avec succès.";

        } catch (error) {
            console.error("Erreur de connexion SGE :", error);
            quinteEl.innerText = "ERREUR";
            statusEl.innerText = "Impossible de joindre le serveur. Réessayez dans quelques instants.";
        }
    }

    // Chargement automatique dès l'ouverture de la page
    document.addEventListener('DOMContentLoaded', chargerPronosticSGE);
</script>

</body>
</html>
