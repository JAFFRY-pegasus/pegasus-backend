<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pegasus IA — Pronostic Quinté+</title>
  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    #pegasus-card {
      width: 100%;
      max-width: 480px;
      padding: 30px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }
    .badge-header {
      background: rgba(0, 210, 255, 0.15);
      color: #00d2ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }
    .live-status {
      font-size: 12px;
      color: #4cd964;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .live-dot {
      height: 8px;
      width: 8px;
      background-color: #4cd964;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #4cd964;
    }
    #btn-prono {
      width: 100%;
      background: linear-gradient(90deg, #00d2ff, #0072ff);
      color: #fff;
      font-weight: bold;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      margin-top: 10px;
    }
    #btn-prono:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 210, 255, 0.4); }
    #btn-prono:active { transform: translateY(0); }
    .badge-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
    .num-ball {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #334155, #1e293b);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }
    .num-ball.base-ball {
      background: linear-gradient(135deg, #ff9500, #ff5e00);
      border: none;
      box-shadow: 0 3px 10px rgba(255, 149, 0, 0.4);
    }
    .section-block {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      text-align: left;
    }
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: #94a3b8; font-weight: 600; margin-bottom: 6px; }
  </style>
</head>
<body>

<div id="pegasus-card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <span class="badge-header">SGE v5.0</span>
    <span class="live-status"><span class="live-dot"></span> En direct</span>
  </div>

  <h1 style="margin: 0 0 5px 0; font-size: 24px; font-weight: 700;">Mon pronostic IA PEGASUS</h1>
  <p style="margin: 0 0 20px 0; font-size: 14px; color: #94a3b8;">Analyse algorithmique de la presse</p>

  <button id="btn-prono" onclick="chargerPronostic()">Obtenir la sélection du jour</button>

  <div id="zone-resultat"></div>
</div>

<script>
async function chargerPronostic() {
  const btn = document.getElementById("btn-prono");
  const resultat = document.getElementById("zone-resultat");
  
  btn.innerText = "Calcul en cours...";
  btn.disabled = true;
  btn.style.opacity = "0.7";

  try {
    const response = await fetch("https://pegasus-backend-c3a6.onrender.com/api/v1/pronostic/auto");
    if (!response.ok) throw new Error("Erreur serveur : " + response.status);
    
    const data = await response.json();

    if (data.error) {
      resultat.innerHTML = `<p style="color: #ff3b30; font-size: 14px; margin-top: 20px;">⚠️ ${data.message}</p>`;
    } else {
      const makeBalls = (arr) => arr.map(n => `<div class="num-ball">${n}</div>`).join('');

      resultat.innerHTML = `
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 20px;">
          <p style="font-size: 13px; color: #00d2ff; margin-bottom: 15px; font-weight: 600;">
            📅 Course du ${data.date_course}
          </p>

          <div class="section-block">
            <div class="section-title">⭐ Ticket Maître (Sélection principale)</div>
            <div class="badge-container">${makeBalls(data.ticket_maitre)}</div>
          </div>

          <div class="section-block">
            <div class="section-title">🛡️ Ticket Sécurité (Couverture)</div>
            <div class="badge-container">${makeBalls(data.ticket_securite)}</div>
          </div>

          <div class="section-block">
            <div class="section-title">🎯 Base & Associés</div>
            <div class="badge-container" style="justify-content: flex-start; align-items: center;">
              <div class="num-ball base-ball" title="Base">${data.couple_place.base}</div>
              <span style="color: #94a3b8; font-size: 18px; margin: 0 4px;">+</span>
              ${makeBalls(data.couple_place.associes)}
            </div>
          </div>
        </div>
      `;
    }
  } catch (err) {
    resultat.innerHTML = `<p style="color: #ff3b30; font-size: 14px; margin-top: 20px;">⚠️ Connexion au serveur en cours... Réessaie dans quelques secondes.</p>`;
  } finally {
    btn.innerText = "Actualiser le pronostic";
    btn.disabled = false;
    btn.style.opacity = "1";
  }
}
</script>

</body>
</html>
