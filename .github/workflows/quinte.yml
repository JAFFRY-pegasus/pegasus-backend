name: Mise à jour Quinté+

on:
  schedule:
    # Exécution à 09h30 et 19h30 (heure de Paris)
    - cron: '30 7 * * *'   # 09h30 heure de Paris = 07h30 UTC
    - cron: '30 17 * * *'  # 19h30 heure de Paris = 17h30 UTC
  workflow_dispatch:       # Permet le déclenchement manuel

jobs:
  update-quinte:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Fetch PMU data with non-partants
        run: python scripts/fetch_quinte.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/quinte.json
          git diff --staged --quiet || git commit -m " Auto-update: données Quinté+ avec non-partants et arrivée"
          git push
